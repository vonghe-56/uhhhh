<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>calendar — for homework</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;min-height:100vh;padding:20px}
.sidebar,.calendar-container{background:#fff;border:1px solid #d8dee6;border-radius:14px;box-shadow:0 4px 15px #0000000a}
.sidebar{position:sticky;top:20px;align-self:start;min-height:calc(100vh - 40px);display:flex;flex-direction:column;padding:22px 18px}
.sidebar-brand{padding:0 4px 22px;border-bottom:1px solid #e2e8f0}.sidebar-brand h1{margin:0;font-size:21px}.sidebar-brand p{margin:6px 0 0;font-size:13px;color:#8491a3}
.sidebar-section{padding:22px 2px}.sidebar-section h3{margin:0 0 15px;font-size:11px;letter-spacing:.8px;color:#8491a3}.empty-message{font-size:13px;color:#9aa5b4}
.upcoming-item{padding:11px 0;border-bottom:1px solid #edf0f4}.upcoming-date{margin-bottom:5px;font-size:11px;font-weight:bold;color:#8491a3}.upcoming-title{font-size:13px;font-weight:bold;overflow-wrap:anywhere}.upcoming-type{margin-top:5px;font-size:10px;font-weight:bold;color:#4f7cff}.upcoming-type.project{color:#9b59b6}.upcoming-type.exam{color:#c0392b}
.sidebar-footer{margin-top:auto;padding-top:18px;border-top:1px solid #e2e8f0;font-size:11px;color:#9aa5b4}
.main-content{min-width:0}.calendar-container{width:100%;min-height:calc(100vh - 40px);padding:24px}
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.calendar-header h2{margin:0;font-size:27px;font-weight:600;text-align:center}.calendar-header button{width:40px;height:40px;border:1px solid #d5dbe3;border-radius:8px;background:#fff;font-size:19px}.calendar-header button:hover{background:#eef2f7}
.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:8px}.weekdays div{padding:10px 4px;text-align:center;font-size:12px;font-weight:bold;color:#64748b}
#calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(130px,auto);width:100%;border-top:1px solid #dce2e8;border-left:1px solid #dce2e8}
.day{min-width:0;min-height:130px;padding:9px;background:#fff;border-right:1px solid #dce2e8;border-bottom:1px solid #dce2e8;overflow:hidden;transition:background .15s}.day:hover{background:#f8fafc}.day.empty{background:#f8fafc}.day.today{background:#fffec9}.day-number{margin-bottom:5px;font-size:14px;font-weight:600;color:#334155}.editable-day{cursor:pointer}.editable-day:hover{background:#f0f5ff}
.event{position:relative;width:100%;margin-top:7px;padding:8px 28px 8px 9px;background:#f8fafc;border:1px solid #d7dee8;border-left:4px solid #4f7cff;border-radius:7px;font-size:13px;overflow:hidden}.event.project{background:#f5efff;border-color:#d8c4f5;border-left-color:#9b59b6}.event.exam{background:#fff1f0;border-color:#f5c2c0;border-left-color:#e74c3c}.event.general-event{background:#eefaf3;border-color:#bce4ca;border-left-color:#27ae60}.event.practice{background:#fff7e6;border-color:#f4d28a;border-left-color:#e6a23c}.event.completed{opacity:.62}.event.completed .event-title{text-decoration:line-through;color:#64748b}.event-check{position:absolute;top:7px;right:32px;width:17px;height:17px;accent-color:#16a34a;cursor:pointer}.event-type{margin-bottom:3px;font-size:10px;font-weight:bold;letter-spacing:.4px;color:#4f7cff}.event.project .event-type{color:#8e44ad}.event.exam .event-type{color:#c0392b}.event.general-event .event-type{color:#219653}.event.practice .event-type{color:#b7791f}.event-title{font-size:13px;font-weight:bold;overflow-wrap:anywhere}.event-description{margin-top:4px;font-size:11px;color:#64748b;overflow-wrap:anywhere}.event-action{position:absolute;top:5px;right:5px;width:21px;height:21px;border:1px solid #d5dbe3;border-radius:5px;background:white;color:#dc2626}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#0f172a73;z-index:10}.overlay.active{display:flex}.event-box{position:relative;width:min(450px,calc(100vw - 40px));padding:28px;background:#fff;border:1px solid #d8dee6;border-radius:14px;box-shadow:0 20px 50px #0003}.event-box h2{margin:0 0 22px;font-size:23px;font-weight:600}.close-button{position:absolute;top:14px;right:16px;width:32px;height:32px;border:0;border-radius:7px;background:#f1f5f9;color:#64748b;font-size:22px}
.event-box label{display:block;margin:15px 0 6px;font-size:13px;font-weight:bold;color:#475569}.event-box input,.event-box select,.event-box textarea{width:100%;padding:10px 12px;border:1px solid #d5dce5;border-radius:7px;background:#f8fafc;color:#17202a;font-size:14px;outline:none}.event-box input:focus,.event-box select:focus,.event-box textarea:focus{border-color:#4f7cff;background:#fff;box-shadow:0 0 0 3px #4f7cff1f}.event-box textarea{min-height:100px;resize:vertical}.save-button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:#4f7cff;color:white;font-size:14px;font-weight:bold}.save-button:hover{background:#3b67df}
@media(max-width:900px){.app-layout{grid-template-columns:210px minmax(0,1fr);gap:12px;padding:12px}.calendar-container{padding:15px}.day{min-height:110px;padding:6px}}
@media(max-width:650px){.app-layout{display:flex;flex-direction:column;padding:10px}.sidebar{position:static;min-height:auto;padding:16px}.sidebar-section{padding:14px 2px}.sidebar-footer{display:none}.calendar-container{min-height:auto;padding:12px}.calendar-header{margin-bottom:12px}.calendar-header h2{font-size:21px}.calendar-header button{width:34px;height:34px}#calendar{grid-auto-rows:minmax(82px,auto)}.day{min-height:82px;padding:4px}.day-number{font-size:12px}.weekdays div{font-size:10px;padding:8px 1px}.event{padding:5px 4px;border-left-width:3px}.event-type{font-size:8px}.event-title{font-size:10px}.event-description{display:none}.event-action{position:static;width:100%;height:18px;margin-top:4px;font-size:10px}}
</style>
</head>
<body>
<main class="app-layout">
<aside class="sidebar">
  <div class="sidebar-brand"><h1>calendar</h1><p>for homework</p></div>
  <div class="sidebar-section"><h3>NEXT DUE</h3><div id="upcomingEvents"><p class="empty-message">No upcoming events</p></div></div>
  <div class="sidebar-footer">School Calendar</div>
</aside>
<section class="main-content"><div class="calendar-container">
  <div class="calendar-header"><button id="previousMonth" aria-label="Previous month">&lt;</button><h2 id="monthYear"></h2><button id="nextMonth" aria-label="Next month">&gt;</button></div>
  <div class="weekdays"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div>
  <div id="calendar"></div>
</div></section>
</main>
<div id="eventOverlay" class="overlay"><form class="event-box" id="eventForm">
  <button type="button" id="closeEvent" class="close-button" aria-label="Close">×</button>
  <h2 id="selectedDate"></h2>
  <label for="eventType">Type</label><select id="eventType"><option value="HW">Homework</option><option value="PRACTICE">Practice</option><option value="PROJECT">Project</option><option value="EXAM">Exam</option><option value="EVENT">Event</option></select>
  <label for="eventTitle">Title</label><input id="eventTitle" type="text" placeholder="Example: Math homework" required maxlength="100">
  <label for="eventDescription">Description</label><textarea id="eventDescription" placeholder="Add details..." maxlength="500"></textarea>
  <button id="saveEvent" class="save-button" type="submit">SAVE</button>
</form></div>
<script>
const calendar=document.getElementById('calendar'),monthYear=document.getElementById('monthYear'),overlay=document.getElementById('eventOverlay');
const typeInfo={HW:{label:'HOMEWORK',cls:''},PRACTICE:{label:'PRACTICE',cls:'practice'},PROJECT:{label:'PROJECT',cls:'project'},EXAM:{label:'EXAM',cls:'exam'},EVENT:{label:'EVENT',cls:'general-event'}};
const checkableTypes=['HW','PRACTICE','PROJECT'];
let currentDate=new Date(),selectedDateKey=null,editingId=null;
let events=JSON.parse(localStorage.getItem('cnnlendar-events')||'{}');
const pad=n=>String(n).padStart(2,'0'),keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function save(){localStorage.setItem('cnnlendar-events',JSON.stringify(events));render();}
function openModal(dateKey,item=null){selectedDateKey=dateKey;editingId=item?.id??null;const d=new Date(dateKey+'T12:00:00');document.getElementById('selectedDate').textContent=d.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.getElementById('eventType').value=item?.type||'HW';document.getElementById('eventTitle').value=item?.title||'';document.getElementById('eventDescription').value=item?.description||'';document.getElementById('saveEvent').textContent=item?'UPDATE':'SAVE';overlay.classList.add('active');document.getElementById('eventTitle').focus();}
function closeModal(){overlay.classList.remove('active');document.getElementById('eventForm').reset();editingId=null;}
function render(){const year=currentDate.getFullYear(),month=currentDate.getMonth();monthYear.textContent=currentDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});calendar.innerHTML='';const first=new Date(year,month,1),last=new Date(year,month+1,0);let offset=(first.getDay()+6)%7;for(let i=0;i<offset;i++){const blank=document.createElement('div');blank.className='day empty';calendar.appendChild(blank);}
const today=keyOf(new Date());for(let n=1;n<=last.getDate();n++){const date=new Date(year,month,n),dateKey=keyOf(date),cell=document.createElement('div');cell.className='day editable-day'+(dateKey===today?' today':'');cell.innerHTML=`<div class="day-number">${n}</div>`;cell.addEventListener('click',e=>{if(!e.target.closest('.event'))openModal(dateKey);});(events[dateKey]||[]).forEach(item=>{const info=typeInfo[item.type]||typeInfo.HW,card=document.createElement('div');card.className='event '+info.cls+(item.completed?' completed':'');const type=document.createElement('div');type.className='event-type';type.textContent=info.label;const title=document.createElement('div');title.className='event-title';title.textContent=item.title;card.append(type,title);if(checkableTypes.includes(item.type)){const check=document.createElement('input');check.type='checkbox';check.className='event-check';check.checked=!!item.completed;check.setAttribute('aria-label','Mark '+item.title+' as completed');check.title=item.completed?'Completed':'Mark as completed';check.addEventListener('click',e=>e.stopPropagation());check.addEventListener('change',e=>{item.completed=e.target.checked;save();});card.append(check);}if(item.description){const desc=document.createElement('div');desc.className='event-description';desc.textContent=item.description;card.append(desc);}const del=document.createElement('button');del.className='event-action';del.type='button';del.textContent='×';del.title='Delete';del.addEventListener('click',e=>{e.stopPropagation();if(confirm('Delete this item?')){events[dateKey]=events[dateKey].filter(x=>x.id!==item.id);if(!events[dateKey].length)delete events[dateKey];save();}});card.addEventListener('click',e=>{e.stopPropagation();openModal(dateKey,item);});card.append(del);cell.append(card);});calendar.append(cell);}
const total=offset+last.getDate(),trailing=(7-total%7)%7;for(let i=0;i<trailing;i++){const blank=document.createElement('div');blank.className='day empty';calendar.append(blank);}renderUpcoming();}
function renderUpcoming(){const host=document.getElementById('upcomingEvents'),today=keyOf(new Date());const all=Object.entries(events).flatMap(([date,items])=>items.map(item=>({...item,date}))).filter(x=>x.date>=today&&!x.completed).sort((a,b)=>a.date.localeCompare(b.date));host.innerHTML='';if(!all.length){host.innerHTML='<p class="empty-message">No upcoming events</p>';return;}all.slice(0,5).forEach(item=>{const info=typeInfo[item.type]||typeInfo.HW,wrap=document.createElement('div');wrap.className='upcoming-item';const date=document.createElement('div');date.className='upcoming-date';date.textContent=new Date(item.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});const title=document.createElement('div');title.className='upcoming-title';title.textContent=item.title;const type=document.createElement('div');type.className='upcoming-type '+info.cls;type.textContent=info.label;wrap.append(date,title,type);wrap.addEventListener('click',()=>{const d=new Date(item.date+'T12:00:00');currentDate=new Date(d.getFullYear(),d.getMonth(),1);render();});host.append(wrap);});}
document.getElementById('previousMonth').onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);render();};document.getElementById('nextMonth').onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);render();};document.getElementById('closeEvent').onclick=closeModal;overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('eventForm').addEventListener('submit',e=>{e.preventDefault();const item={id:editingId||crypto.randomUUID(),type:document.getElementById('eventType').value,title:document.getElementById('eventTitle').value.trim(),description:document.getElementById('eventDescription').value.trim()};if(!item.title)return;events[selectedDateKey]??=[];if(editingId){events[selectedDateKey]=events[selectedDateKey].map(x=>x.id===editingId?item:x);}else events[selectedDateKey].push(item);closeModal();save();});
render();
</script>
</body></html>
